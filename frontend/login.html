<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login - FreelanceHub</title>
  <link rel="stylesheet" href="/css/style.css">
  <script src="/js/app.js"></script>
  <script src="/js/auth.js"></script>
</head>
<body style="background:var(--light-bg); display:flex; align-items:center; justify-content:center; min-height:100vh; padding:20px;">

  <div style="width:100%; max-width:440px; background:var(--card-bg); border:1px solid var(--border-color); border-radius:var(--radius-lg); padding:36px; box-shadow:var(--shadow-lg);">
    <div style="text-align:center; margin-bottom:28px;">
      <div class="brand-logo" style="margin:0 auto 12px; width:48px; height:48px; font-size:24px;">F</div>
      <h2 style="font-size:24px; font-weight:800; color:var(--text-main);">Welcome Back</h2>
      <p style="font-size:14px; color:var(--text-muted); margin-top:4px;">Log in to manage your freelance business</p>
    </div>

    <form id="loginForm">
      <div class="form-group">
        <label class="form-label" for="loginEmail">Email Address</label>
        <input type="email" id="loginEmail" class="form-control" placeholder="your.email@example.com" required>
      </div>

      <div class="form-group">
        <div style="display:flex; justify-content:space-between; align-items:center;">
          <label class="form-label" for="loginPassword">Password</label>
          <a href="/forgot-password.html" style="font-size:12px; color:var(--primary); text-decoration:none; font-weight:600;">Forgot?</a>
        </div>
        <input type="password" id="loginPassword" class="form-control" placeholder="••••••••" required>
      </div>

      <button type="submit" class="btn btn-primary" style="width:100%; margin-top:12px; padding:12px;">Sign In</button>
    </form>

    <div style="text-align:center; margin-top:24px; font-size:14px; color:var(--text-muted);">
      Don't have an account? <a href="/signup.html" style="color:var(--primary); font-weight:700; text-decoration:none;">Create Account</a>
    </div>
  </div>

</body>
</html>
