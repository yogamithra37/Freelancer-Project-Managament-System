<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Tasks - FreelanceHub</title>
  <link rel="stylesheet" href="/css/style.css">
  <script src="/js/i18n.js"></script>
  <script src="/js/app.js"></script>
  <script src="/js/tasks.js"></script>
</head>
<body>

  <div class="app-container">
    <aside class="sidebar" id="appSidebar"></aside>

    <div class="main-content">
      <header class="top-navbar" id="appHeader"></header>

      <main class="page-body">
        <div class="page-header">
          <div>
            <h1 class="page-title" data-i18n="tasks">Tasks & Milestones</h1>
            <p class="page-subtitle">Organize project task lists, deadlines, and completion statuses</p>
          </div>
          <button class="btn btn-primary" onclick="openTaskModal()">+ Add Task</button>
        </div>

        <!-- Filters -->
        <div class="panel" style="padding:16px; margin-bottom:20px;">
          <div style="display:flex; gap:16px; flex-wrap:wrap; align-items:center;">
            <div style="flex:1; min-width:240px;">
              <input type="text" id="taskSearch" class="form-control" placeholder="Search task name or notes..." data-i18n="search">
            </div>

            <div style="width:160px;">
              <select id="taskStatusFilter" class="form-control">
                <option value="">All Statuses</option>
                <option value="To Do">To Do</option>
                <option value="In Progress">In Progress</option>
                <option value="Review">Review</option>
                <option value="Completed">Completed</option>
              </select>
            </div>

            <div style="width:160px;">
              <select id="taskPriorityFilter" class="form-control">
                <option value="">All Priorities</option>
                <option value="Low">Low</option>
                <option value="Medium">Medium</option>
                <option value="High">High</option>
                <option value="Urgent">Urgent</option>
              </select>
            </div>
          </div>
        </div>

        <!-- Tasks Table Panel -->
        <div class="panel">
          <div class="table-responsive">
            <table class="data-table">
              <thead>
                <tr>
                  <th>Task Title</th>
                  <th>Project</th>
                  <th>Priority</th>
                  <th>Status</th>
                  <th>Due Date</th>
                  <th>Actions</th>
                </tr>
              </thead>
              <tbody id="tasksContainer"></tbody>
            </table>
          </div>
        </div>

      </main>
    </div>
  </div>

  <!-- Add/Edit Task Modal -->
  <div class="modal-overlay" id="taskModal">
    <div class="modal-content" style="max-width:580px;">
      <div class="modal-header">
        <h3 class="modal-title" id="modalTaskTitle">Add New Task</h3>
        <button class="modal-close" onclick="closeTaskModal()">&times;</button>
      </div>

      <form id="taskForm">
        <input type="hidden" id="taskId">

        <div class="form-group">
          <label class="form-label" for="taskProjectSelect">Project *</label>
          <select id="taskProjectSelect" class="form-control" required></select>
        </div>

        <div class="form-group">
          <label class="form-label" for="taskTitle">Task Name *</label>
          <input type="text" id="taskTitle" class="form-control" placeholder="Design Wireframes" required>
        </div>

        <div class="form-row">
          <div class="form-group">
            <label class="form-label" for="taskAssigned">Assigned To</label>
            <input type="text" id="taskAssigned" class="form-control" value="Self">
          </div>
          <div class="form-group">
            <label class="form-label" for="taskPriority">Priority</label>
            <select id="taskPriority" class="form-control">
              <option value="Low">Low</option>
              <option value="Medium" selected>Medium</option>
              <option value="High">High</option>
              <option value="Urgent">Urgent</option>
            </select>
          </div>
        </div>

        <div class="form-row">
          <div class="form-group">
            <label class="form-label" for="taskStatus">Status</label>
            <select id="taskStatus" class="form-control">
              <option value="To Do" selected>To Do</option>
              <option value="In Progress">In Progress</option>
              <option value="Review">Review</option>
              <option value="Completed">Completed</option>
            </select>
          </div>
          <div class="form-group">
            <label class="form-label" for="taskProgress">Progress (%)</label>
            <input type="number" id="taskProgress" class="form-control" min="0" max="100" value="0">
          </div>
        </div>

        <div class="form-row">
          <div class="form-group">
            <label class="form-label" for="taskStartDate">Start Date</label>
            <input type="date" id="taskStartDate" class="form-control">
          </div>
          <div class="form-group">
            <label class="form-label" for="taskDueDate">Due Date *</label>
            <input type="date" id="taskDueDate" class="form-control" required>
          </div>
        </div>

        <div class="form-group">
          <label class="form-label" for="taskDescription">Description / Notes</label>
          <textarea id="taskDescription" class="form-control" placeholder="Task details..."></textarea>
        </div>

        <div style="display:flex; justify-content:flex-end; gap:12px; margin-top:20px;">
          <button type="button" class="btn btn-secondary" onclick="closeTaskModal()">Cancel</button>
          <button type="submit" class="btn btn-primary">Save Task</button>
        </div>
      </form>
    </div>
  </div>

</body>
</html>
