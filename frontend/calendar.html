<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Calendar - FreelanceHub</title>
  <link rel="stylesheet" href="/css/style.css">
  <script src="/js/i18n.js"></script>
  <script src="/js/app.js"></script>
  <script src="/js/calendar.js"></script>
</head>
<body>

  <div class="app-container">
    <aside class="sidebar" id="appSidebar"></aside>

    <div class="main-content">
      <header class="top-navbar" id="appHeader"></header>

      <main class="page-body">
        <div class="page-header">
          <div>
            <h1 class="page-title">Deadline Calendar</h1>
            <p class="page-subtitle">Visual month grid for project milestones, task deadlines, and due invoices</p>
          </div>
          <div style="display:flex; gap:12px; align-items:center;">
            <button class="btn btn-secondary btn-sm" id="prevMonthBtn">← Prev</button>
            <h3 style="font-size:18px; font-weight:800; min-width:160px; text-align:center;" id="currentMonthLabel">July 2026</h3>
            <button class="btn btn-secondary btn-sm" id="nextMonthBtn">Next →</button>
          </div>
        </div>

        <!-- Calendar Panel -->
        <div class="panel" style="padding:16px;">
          <!-- Days Header -->
          <div style="display:grid; grid-template-columns:repeat(7, 1fr); text-align:center; font-weight:800; font-size:13px; color:var(--text-muted); padding-bottom:12px; border-bottom:1px solid var(--border-color);">
            <div>SUN</div>
            <div>MON</div>
            <div>TUE</div>
            <div>WED</div>
            <div>THU</div>
            <div>FRI</div>
            <div>SAT</div>
          </div>

          <!-- Calendar Grid -->
          <div style="display:grid; grid-template-columns:repeat(7, 1fr); margin-top:1px;" id="calendarGrid"></div>
        </div>

      </main>
    </div>
  </div>

</body>
</html>
