<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sign Up - FreelanceHub</title>
  <link rel="stylesheet" href="/css/style.css">
  <script src="/js/app.js"></script>
  <script src="/js/auth.js"></script>
</head>
<body style="background:var(--light-bg); display:flex; align-items:center; justify-content:center; min-height:100vh; padding:20px;">

  <div style="width:100%; max-width:480px; background:var(--card-bg); border:1px solid var(--border-color); border-radius:var(--radius-lg); padding:36px; box-shadow:var(--shadow-lg);">
    <div style="text-align:center; margin-bottom:28px;">
      <div class="brand-logo" style="margin:0 auto 12px; width:48px; height:48px; font-size:24px;">F</div>
      <h2 style="font-size:24px; font-weight:800; color:var(--text-main);">Create FreelanceHub Account</h2>
      <p style="font-size:14px; color:var(--text-muted); margin-top:4px;">Start tracking projects, clients, and revenue</p>
    </div>

    <form id="signupForm">
      <div class="form-group">
        <label class="form-label" for="signupName">Full Name *</label>
        <input type="text" id="signupName" class="form-control" placeholder="Arun Kumar" required>
      </div>

      <div class="form-row">
        <div class="form-group">
          <label class="form-label" for="signupEmail">Email Address *</label>
          <input type="email" id="signupEmail" class="form-control" placeholder="arun@example.com" required>
        </div>
        <div class="form-group">
          <label class="form-label" for="signupPhone">Phone Number</label>
          <input type="tel" id="signupPhone" class="form-control" placeholder="+91 9876543210">
        </div>
      </div>

      <div class="form-row">
        <div class="form-group">
          <label class="form-label" for="signupPassword">Password *</label>
          <input type="password" id="signupPassword" class="form-control" placeholder="••••••••" required>
        </div>
        <div class="form-group">
          <label class="form-label" for="signupConfirmPassword">Confirm Password *</label>
          <input type="password" id="signupConfirmPassword" class="form-control" placeholder="••••••••" required>
        </div>
      </div>

      <button type="submit" class="btn btn-primary" style="width:100%; margin-top:12px; padding:12px;">Create Account</button>
    </form>

    <div style="text-align:center; margin-top:24px; font-size:14px; color:var(--text-muted);">
      Already registered? <a href="/login.html" style="color:var(--primary); font-weight:700; text-decoration:none;">Log In</a>
    </div>
  </div>

</body>
</html>
